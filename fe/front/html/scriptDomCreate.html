<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="../css/create.css" rel="stylesheet">
    </head>
    <body>
        <h2>사용자 목록</h2>
        <div class ="container" id="container">

        </div>

        <script>
            ary=[];
            const loadData=async()=>{
                await fetch(`../server/users.json`)
                    .then(response=>response.json())
                    .then(data=>{
                        console.log(`debug >>> data: `,data);
                        ary=data;
                    })
                    .catch(error=>{
                        console.log(`debug >>> error ${error}`);
                });
                makeCard();
            }
            
            /*
            서버 통신을 통해서 전달받은 데이터를 배열변수 담았다고 가정
            */
           const makeCard=()=>{
                container.innerHTML=''; // clear시키고 re-rendering 하는 작업
                ary.forEach((obj, idx)=>{
                    const card=document.createElement('div');
                    card.className='card';
                    container.appendChild(card);

                    const name = document.createElement('h3');
                    name.textContent=obj.name;
                    const major = document.createElement('p');//이러면 태그가 만들어짐-이렇게 해서 특정 값 씌울 수 있음
                    major.textContent=obj.major;
                    const phone = document.createElement('p');
                    phone.textContent=obj.phone;


                    //button
                    const delBtn=document.createElement('button');
                    delBtn.className='btn';
                    delBtn.textContent="삭제";
                
                    delBtn.onclick=(e)=>{
                        window.alert('button click')
                        ary.splice(idx,1);
                        makeCard(); // 버튼 누르면 다시 ary에 맞게 카드를 뿌려 내야 한다.
                    };

                    card.appendChild(name); 
                    card.appendChild(major); 
                    card.appendChild(phone); 
                    card.appendChild(delBtn);

                    container.appendChild(card); 
                });
            };

            const init=async()=>{
                await loadData();
                makeCard();
            }
            init();
            
        </script>
    </body>
</html>
