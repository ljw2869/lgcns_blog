<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            /*
            함수(function) vs 메서드(method)
            함수는 독립 실행가능, 메서드는 인스턴스의 소유
            arrow function vs lambda expression
            - 특정 기능을 수행하기 위한 코드블럭
            */
           //definition
           function test(x,y){
            return x+y;
           }
           //calling
           let result=test(10,20);
           console.log(`debug >>> ${result}`);

           // 참조타입 변수는 함수를 담을 수 있다. 함수에는 이름이 없으니 anonymous함수(익명함수)라 한다.
           let btnHandler=function(){
                console.log(`debug >>> 익명의 함수입니다.`);
           };
           console.log(`debug >>> function type ${typeof btnHandler}`);
           btnHandler();

           // es6에서 제공하는 arrow function - 앞으로 이런 유형의 함수를 표준으로 쓰는 것을 권장
           let arrowFunc=()=>{
                console.log(`화살표 함수호출!! `);
           }
           arrowFunc();

           let add=(a,b)=>a+b;// {}블록이 없으면 구현부가 무조건 리턴이 됨
           //단순한 작업을 익명으로 사용하여 빠르게 반환하는 것이 목적이니, {} 사용을 안하는 것이 좋음
           // {}를 사용시 무조건 return을 넣어주는 것을 잊지 말아야 한다. 
           console.log(`debug >>> add function ${add(10,20)} `);

           let obj={
                name:"jslim",
                study: function(){
                return ["html","script","css"];
                }//객체가 function으로 값을 받을 수 있다.
           };
           let ary=obj.study();//study()는 함수가 아닌 메서드, 인스턴스의 소유이다.
           console.log(`debug >>> ary `,ary);
           
           // es6
           // 구조분해 - destructuring
           obj={
                name:"jslim",
                study: function(){
                return {html: "html",script:"script",css:"css"};
                }//객체가 function으로 값을 받을 수 있다.
           };
           
           // let instance=obj.study();
           // console.log(`debug >>> html `,instance.html);
           //let {html, script,css}=obj.study(); // 순서와는 상관이 없어서 변수의 이름만 같다면 알아서 매칭되어 저장됨
           //console.log(`debug >>> html` ,html); // 바로 접근

            //축약문법
            let html="html";
            let css="css";
            let javascript="javascript";

            obj={
                name:"jwlee",
                study:function(){
                    return {
                        html,
                        script,
                        css
                    }
                }
            };
            console.log(`debug >>> 배열 변수와 함께 사용되는 함수와 람다식 `);
            const ages=[20,24,26,30,34,38];

            const newAges=ages.map(age=>age*2);// 함수 내 함수의 구현부를 람다식으로 많듦
            console.log(`debug >>> newAges `,newAges);


            const evenAges=ages.filter(age=>age%2===0);
            console.log(`debug >>> evenAges `,evenAges);

            /*
            Q1)
            - emial을 키로 하고 nickName 값을 값으로 하는 새로운 객체를 만들려고 한다. 
            - 즉, 배열을 가공해서 하나의 객체로 합치는 것
            hint)
            - array : reduce(acc, cur, idx, ary) 함수 (누적된 값, current index, )
            - 배열 객체의 grouping을 위해서 많이 사용됨
            */
           const usreAry=[
                {email:"naver.com", nickName:"IronMan"},
                {email:"google.com", nickName:"Bob"},
                {email:"daum.com", nickName:"Alice"}
           ];

           const reduceAry=userAry.reduce((obj,cur)=>{
                obj[cur.email]=cur.nickName;
                return obj;
           },{});// 초기값은 비어있는 객체로 하도록 설정
           console.log(`debug >>> reduceAry `,reduceAry);
           
        </script>
    </body>
</html>
