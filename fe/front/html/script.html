<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Script</title>
    </head>
    <body>
        <script>
            /*
            script(interpreter)
            변수: 데이터를 담는 그릇
            - 변수의 타입이 존재하지 않는다(es6 var, let, const). (typescript)
            - 실행 시점(변수에 값이 할당되는 시점)에 변수의 타입이 묵시적으로 할당
            - 기본타입(숫자, 문자(열), 논리, null, undefined)
            - 참조타입(Object, Array, Function, etc...) - object
            - 흐름제어구문, 반복구문
            - 함수(Function)
            */
            var message="script";
            console.log(`debug >>> message =${message}`);
            console.log(`debug >>> message =${typeof message}`);

            message=10; 
            console.log(`debug >>> message =${message}`);
            console.log(`debug >>> message =${typeof message}`);
            console.log(`debug >>> message ==${ message== "10"}`); //true
            // var에 무엇이 담겨있는지 잘 모르는 문제 발생- 묵시적 형변환
            // == 는 값만 비교해주고 type은 확인해주지 않는다.  
            console.log(`debug >>> message ===${ message=== "10"}`);//false
            // ===는 값만 비교하는 것이 아니라 변수의 타입까지 같이 비교해준다.

            // let과 const권장 message- var는 같은 범위에 있을 때 여러 개 선언되어도 에러발생 안됨
            let msg="let 키워드를 중복하면 중복 변수 선언을 방지할 수 있습니다."
            //let msg=10;
            msg="error"; // 이건 가능

            const num=10; // 상수는 값을 재할당할 수 없습니다. 
            // num=20; // script.html:39 Uncaught TypeError: Assignment to constant variable.
            console.log(`debug >>> 스크립트에서 가장 많이 사용하는 변수의 타입 - Object`);
            console.log(`debug >>> script object === json(rest api {key : value})`);
            let obj={
                name: "jslim",
                age:20,
                major:"cs"
            };// 이게 여러 개가 되면 배열
            console.log("degug >>> obj value",obj);
            console.log("degug >>> obj type",typeof obj);
            console.log("degug >>> obj property",obj.major);
            console.log("degug >>> obj property",obj['major']);

            console.log("degug >>> 스크립트 객체를 담는 변수의 타입 [] - Array");
            let ary=[
                {name:"inspire"},
                {name:"lgcns"},
                {name:"am"},
                {name: "camp6th"}
            ];
            console.log("degug >>> ary value: ",ary);
            console.log("degug >>> ary type: ",typeof ary);
            console.log("degug >>> ary index:",ary[0].name);
            console.log(`degug >>> ary index: ${ary[3].name}`);
        </script>
    </body>
</html>
